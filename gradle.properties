# BBS++ FSR 分支（Minecraft 1.21.1 / NeoForge）
# 与 main 分支（1.20.1 Fabric）不同，这里走 NeoGradle + 官方 Mojang 映射。
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true

# 平台版本，与 references/bbs-FSR 保持一致
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.222
neo_version_range=[21.1,)
loader_version_range=[1,)
java_version=21

# 模组坐标
mod_id=bbsplusplus
mod_name=BBS++
mod_version=2.5.5
mod_group_id=gbeic
mod_license=All-Rights-Reserved
archives_base_name=BBS++-FSR

# BBS FSR 编译期依赖所在目录（相对项目根目录）。
# 留空时按顺序自动探测 libs/ 与 references/bbs-FSR/build/libs/。
bbs_fsr_jar_dir=
